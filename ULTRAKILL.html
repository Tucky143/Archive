<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@master/ultrakill/">
    <meta charset="utf-8">
    <title>Unity WebGL Player | ULTRAKILL</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7856P3VNT"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-L7856P3VNT');
    </script>

    <style>
        html, body, #unity-canvas {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: #000;
        }
        #loading-text {
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 48px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="loading-text">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>

    <script src="Build/ultrakill.loader.js"></script>
    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loadingText = document.querySelector("#loading-text");

        // Handle Mobile vs Desktop Viewports & Sizing
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.head.appendChild(meta);
            canvas.style.position = "fixed";
        } else {
            const resizeCanvas = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            };
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        // Modernized chunk fetcher and merger using async/await
        async function loadAndMergeChunks(baseName, totalParts) {
            const chunks = [];
            for (let i = 1; i <= totalParts; i++) {
                const response = await fetch(`${baseName}.part${i}`);
                if (!response.ok) throw new Error(`Failed to fetch part ${i} of ${baseName}`);
                const buffer = await response.arrayBuffer();
                chunks.push(buffer);
            }
            return URL.createObjectURL(new Blob(chunks));
        }

        // Main loader
        async function initGame() {
            try {
                // Download data chunks parallelly
                const [dataUrl, wasmUrl] = await Promise.all([
                    loadAndMergeChunks("Build/ultrakill.data.unityweb", 4),
                    loadAndMergeChunks("Build/ultrakill.wasm.unityweb", 2)
                ]);

                canvas.hidden = false;

                // Start Unity Game Instance
                createUnityInstance(canvas, {
                    dataUrl: dataUrl,
                    frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Hakita and Cake Logic",
                    productName: "ULTRAKILL",
                    productVersion: "1.4"
                }).then(() => {
                    loadingText.remove();
                });

            } catch (error) {
                console.error("Error loading game files:", error);
                loadingText.innerText = "FAILED TO LOAD GAME";
            }
        }

        // Fire the loader
        initGame();
    </script>
</body>
</html>
