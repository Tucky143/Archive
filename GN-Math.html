  1. Removed window.sadjgknsdfjg (same-origin trick useless in GAS)
  2. Removed /commits fetch — CONFIG.html falls back immediately; no same-origin fetch in GAS
  3. Replaced history.pushState/pushState with no-ops (blocked in GAS sandboxed iframe)
  4. Removed HTMLCanvasElement.toDataURL override (breaks GAS sandbox)
  5. Removed ad/tracker scripts (js.rev.iq, motorsnag popup) — they fail silently and pollute console
  6. Removed Google Analytics gtag (non-functional in GAS, produces errors)
  7. Guarded indexedDB.databases() — not available in all GAS sandbox modes
  8. localStorage try/catch wrapper already present — kept as-is (works in IFRAME mode)
  9. <base href> kept — works fine in GAS HtmlService output
  10. google.script.history not available — history.pushState/replaceState replaced with safe no-ops
-->
<head>
<script>
(function() {
    const memoryStorage = {};
    const safeStorage = {
        getItem: function(key) {
            try { return localStorage.getItem(key); } catch(e) { return memoryStorage[key] || null; }
        },
        setItem: function(key, value) {
            try { localStorage.setItem(key, value); } catch(e) { memoryStorage[key] = String(value); }
        },
        removeItem: function(key) {
            try { localStorage.removeItem(key); } catch(e) { delete memoryStorage[key]; }
        }
    };
    try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
    } catch(e) {
        Object.defineProperty(window, 'localStorage', { value: safeStorage, writable: false, configurable: false });
    }
    try {
        document.cookie = 'test=test';
    } catch(e) {
        Object.defineProperty(document, 'cookie', {
            get: function() { return ''; },
            set: function() { return true; }
        });
    }

    // GAS FIX: history.pushState is blocked in GAS sandboxed iframes — replace with no-ops
    try {
        history.pushState(null, '', window.location.href); // test it
    } catch(e) {
        // If it throws, patch it to a no-op
        history.pushState = function() {};
        history.replaceState = function() {};
    }
    // Unconditionally wrap to suppress DOMException in GAS iframe mode
    var _origPushState = history.pushState;
    history.pushState = function() { try { _origPushState.apply(history, arguments); } catch(e) {} };
    var _origReplaceState = history.replaceState;
    history.replaceState = function() { try { _origReplaceState.apply(history, arguments); } catch(e) {} };
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
// GAS FIX: Block school monitoring domains (same as original)
const schoolList = ["deledao","goguardian","lightspeed","linewize","securly",".edu/"];
function isBlockedDomain(url) {
    try { const domain = new URL(url, location.origin).hostname + "/"; return schoolList.some(s => domain.includes(s)); }
    catch(e) { return false; }
}
const originalFetch = window.fetch;
window.fetch = function(url, options) {
    if (isBlockedDomain(url)) return Promise.reject(new Error("Blocked"));
    return originalFetch.apply(this, arguments);
};
const originalOpen = XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open = function(method, url) {
    if (isBlockedDomain(url)) return;
    return originalOpen.apply(this, arguments);
};

// GAS FIX: CONFIG — skip the /commits same-origin fetch entirely.
// We fetch commits from the GitHub API directly (same as the fallback in init()).
// CONFIG.html starts null and is resolved async, same as before.
const CONFIG = {
    zones: "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
    tagsZones: "https://cdn.jsdelivr.net/gh/sealiee11/gnmathstuff@main/zones.json",
    covers: "https://cdn.jsdelivr.net/gh/freebuisness/covers@main",
    html: "https://cdn.jsdelivr.net/gh/freebuisness/html@main", // GAS FIX: safe fallback immediately; async override below
    stats: "https://data.jsdelivr.com/v1/stats/packages/gh/gn-math/html@main/files?period="
};

// GAS FIX: Resolve commit hash from GitHub API directly (no same-origin /commits needed)
(async function resolveHtmlCdn() {
    try {
        const res = await fetch("https://api.github.com/repos/freebuisness/html/commits?per_page=1");
        if (res.ok) {
            const json = await res.json();
            const sha = json[0]?.sha;
            if (sha) CONFIG.html = `https://cdn.jsdelivr.net/gh/freebuisness/html@${sha}`;
        }
    } catch(e) {
        // Keep the @main fallback set above
    }
})();

let state = {
    games: [], hits: {}, theme: 'modern', categories: [], tagGames: []
};

async function init() {
    let zonesURL = CONFIG.zones;
    try {
        const shaRes = await fetch("https://api.github.com/repos/freebuisness/assets/commits?t=" + Date.now());
        if (shaRes.ok) {
            const shajson = await shaRes.json();
            const sha = shajson[0]?.sha;
            if (sha) zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
        }
    } catch(e) {
        try {
            const r2 = await fetch("https://raw.githubusercontent.com/gn-math/xml/refs/heads/main/sha.txt?t=" + Date.now());
            if (r2.ok) {
                const sha = (await r2.text()).trim();
                if (sha) zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
            }
        } catch(e2) {}
    }

    try {
        const zonesRes = await fetch(zonesURL + "?t=" + Date.now());
        state.games = await zonesRes.json();
        try {
            const tagRes = await fetch(CONFIG.tagsZones + "?t=" + Date.now());
            state.tagGames = await tagRes.json();
        } catch(e) { state.tagGames = state.games; }

        if (state.games.length > 0) state.games[0].featured = true;
        extractCategories();
        renderApp();

        // GAS FIX: URL param ?id= still works for direct links; pushState replaced with no-op above
        const search = new URLSearchParams(window.location.search);
        const id = search.get('id');
        if (id) {
            const zone = state.games.find(z => z.id + '' === id + '');
            if (zone) openGame(zone.id);
        }

        fetchAllStats('day');
        fetchAllStats('week');
        fetchAllStats('month');
        fetchAllStats('quarter');
        fetchAllStats('year');
        getAllStats();
    } catch(e) {
        console.error("Init failed", e);
        alert("Failed to load games. Error: " + e.message);
    }
}

async function fetchAllStats(period) {
    if (!state.hits[period]) state.hits[period] = {};
    let page = 1, hasMore = true;
    while (hasMore) {
        try {
            const res = await fetch(`${CONFIG.stats}${period}&page=${page}`);
            if (res.status === 425) { hasMore = false; break; }
            const data = await res.json();
            if (!data || data.length === 0) { hasMore = false; }
            else {
                data.forEach(f => {
                    const match = f.name.match(/\/(\d+)\.html/);
                    if (match) {
                        const id = match[1];
                        if (!state.hits[period][id]) state.hits[period][id] = 0;
                        state.hits[period][id] += f.hits.total;
                    }
                });
                page++;
                if (page === 2) updatePlayCounts();
                await new Promise(r => setTimeout(r, 500));
            }
        } catch(e) { hasMore = false; }
    }
    updatePlayCounts();
    if (period === 'week') { updateTrendingWeek(); updateTagSections(); }
}

function updateTrendingWeek() {
    const trendingWeek = [...state.games].sort((a,b) => getScore(b,'week') - getScore(a,'week')).slice(0,15);
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const el = document.getElementById('trendingWrapper');
    if (el) {
        el.innerHTML = trendingWeek.map(g => `
            <div class="swiper-slide">
                <div class="game-card" onclick="event.stopPropagation();openGame(${g.id})">
                    <div class="star-icon ${favorites.includes(g.id)?'starred':''}" onclick="event.stopPropagation();toggleFavorite(${g.id})">★</div>
                    <img src="${resolveUrl(g.cover)}" class="card-thumb" loading="lazy">
                    <div class="card-body">
                        <div class="card-title">${g.name}</div>
                        <div class="card-tags">${(g.special||[]).slice(0,2).map(toTitleCase).join(', ')}</div>
                        <div class="stat-row"><span class="stat-dot"></span>${formatPlays(getScore(g,'week'))} Plays</div>
                    </div>
                </div>
            </div>`).join('');
    }
}

function updateTagSections() {
    const tagCount = state.tagCount || 0;
    for (let i = 0; i < tagCount; i++) {
        const wrapperEl = document.getElementById(`tagWrapper${i}`);
        if (!wrapperEl || wrapperEl.children.length === 0) continue;
        wrapperEl.querySelectorAll('.swiper-slide').forEach(slide => {
            const card = slide.querySelector('.game-card');
            if (!card) return;
            const match = card.getAttribute('onclick').match(/openGame\((\d+)\)/);
            if (!match) return;
            const game = state.games.find(g => g.id === parseInt(match[1]));
            if (!game) return;
            const statRow = slide.querySelector('.stat-row');
            if (statRow) statRow.innerHTML = `<span class="stat-dot"></span>${formatPlays(getScore(game,'week'))} Plays`;
        });
    }
}

function updatePlayCounts() {
    document.querySelectorAll('.stat-row').forEach(async el => {
        const card = el.closest('[onclick^="openGame"]');
        if (!card) return;
        const match = card.getAttribute('onclick').match(/openGame\((\d+)\)/);
        if (!match) return;
        const plays = await getStats(match[1]);
        el.innerHTML = `<span class="stat-dot"></span>${formatPlays(plays)} Plays`;
    });
}

function extractCategories() {
    const catSet = new Set();
    state.games.forEach(g => { if (g.special && Array.isArray(g.special)) g.special.forEach(s => catSet.add(s)); });
    state.categories = Array.from(catSet).sort();
}

function getScore(game, period) { return state.hits[period]?.[game.id] || 0; }

function formatPlays(num) {
    if (num >= 1000000) return (num/1000000).toFixed(1) + 'm';
    if (num >= 1000) return (num/1000).toFixed(1) + 'k';
    return num.toString();
}

function resolveUrl(u) {
    return u.replace("{COVER_URL}", CONFIG.covers).replace("{HTML_URL}", CONFIG.html);
}

function toTitleCase(str) {
    return str.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substring(1).toLowerCase());
}

function renderTagSections() {
    const allTags = new Set();
    state.tagGames.forEach(g => { if (g.tags && Array.isArray(g.tags)) g.tags.forEach(t => allTags.add(t)); });
    const tagsArray = Array.from(allTags);
    if (tagsArray.length === 0) return 0;
    const selectedTags = tagsArray.sort(() => Math.random() - 0.5).slice(0, 3);
    const container = document.getElementById('tagSections');
    if (!container) return 0;
    container.innerHTML = selectedTags.map((tag, i) => `
        <div class="section-header"><div class="section-title">${tag}</div></div>
        <div class="swiper horizontal-list" id="tagSwiper${i}">
            <div class="swiper-wrapper" id="tagWrapper${i}"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>`).join('');
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    selectedTags.forEach((tag, i) => {
        const tagGames = state.tagGames.filter(g => g.tags && g.tags.includes(tag)).slice(0, 15);
        const el = document.getElementById(`tagWrapper${i}`);
        if (el && tagGames.length > 0) {
            el.innerHTML = tagGames.map(g => `
                <div class="swiper-slide">
                    <div class="game-card" onclick="event.stopPropagation();openGame(${g.id})">
                        <div class="star-icon ${favorites.includes(g.id)?'starred':''}" onclick="event.stopPropagation();toggleFavorite(${g.id})">★</div>
                        <img src="${resolveUrl(g.cover)}" class="card-thumb" loading="lazy">
                        <div class="card-body">
                            <div class="card-title">${g.name}</div>
                            <div class="card-tags">${(g.tags||[]).slice(0,2).join(', ')}</div>
                            <div class="stat-row"><span class="stat-dot"></span>${formatPlays(getScore(g,'week'))} Plays</div>
                        </div>
                    </div>
                </div>`).join('');
        }
    });
    return selectedTags.length;
}

function renderApp() {
    if (localStorage.getItem('theme') === 'classic') toggleTheme(true);
    renderNavCategories();
    const popular = state.games.filter(g => (g.featured || g.special?.includes('popular')) && !g.special?.includes('tools'));
    const ports = state.games.filter(g => g.special?.includes('port') && !g.special?.includes('tools'));
    const randomGames = [];
    for (let i = 0; i < 2; i++) {
        const rg = state.games[Math.floor(Math.random() * state.games.length)];
        if (!rg.special?.includes('tools')) randomGames.push(rg);
    }
    const popularPick = popular[Math.floor(Math.random() * popular.length)];
    const portPick = ports.length > 0 ? ports[Math.floor(Math.random() * ports.length)] : popular[1];
    const featured = [popularPick, ...randomGames, portPick, popular[0]].filter(Boolean).slice(0, 5);
    renderHero(featured);
    renderSwiper('trendingWrapper', state.games.slice(0, 15));
    const tagCount = renderTagSections();
    state.tagCount = tagCount || 0;
    renderGrid('featuredGrid', state.games.filter(g => g.featured));

    document.getElementById('sortOptions').value = savedSort;
    sortZones();
    renderClassicGrid();
    initSwipers();
}

function renderGrid(id, games) {
    const el = document.getElementById(id);
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    el.innerHTML = games.map((g, index) => {
        const delay = Math.min(index, 20) * 0.03;
        return `
        <div class="game-card" onclick="openGame(${g.id})" style="animation-delay:${delay}s" data-index="${index}">
            <div class="star-icon ${favorites.includes(g.id)?'starred':''}" onclick="event.stopPropagation();toggleFavorite(${g.id})">★</div>
            <img src="${resolveUrl(g.cover)}" class="card-thumb" loading="lazy">
            <div class="card-body">
                <div class="card-title">${g.name}</div>
                <div class="card-tags">${(g.special||[]).slice(0,2).map(toTitleCase).join(', ')}</div>
                <div class="stat-row"><span class="stat-dot"></span>...</div>
            </div>
        </div>`;
    }).join('');
    if (games.length > 20) {
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    if (parseInt(card.dataset.index) > 20) { card.style.animationDelay = '0s'; card.style.opacity = '1'; }
                    observer.unobserve(card);
                }
            });
        }, { rootMargin: '100px' });
        el.querySelectorAll('.game-card').forEach(card => { if (parseInt(card.dataset.index) > 20) observer.observe(card); });
    }
    updatePlayCounts();
}

function sortZones() {
    const sortBy = document.getElementById('sortOptions').value;
    localStorage.setItem('sortPreference', sortBy);
    let sorted = [...state.games];
    const pinned = sorted.filter(g => g.id === -1 || g.id === 596);
    const regular = sorted.filter(g => g.id !== -1 && g.id !== 596 && g.id !== 0 && g.id !== 1);
    if (sortBy === 'name') regular.sort((a,b) => a.name.localeCompare(b.name));
    else if (sortBy === 'id') regular.sort((a,b) => b.id - a.id);
    else if (sortBy === 'popular') regular.sort((a,b) => getScore(b,'year') - getScore(a,'year'));
    renderGrid('allGamesGrid', [...pinned, ...regular]);
}

async function openGame(id) {
    const g = state.games.find(x => x.id === id);
    if (!g) return;
    const stats = JSON.parse(localStorage.getItem('userStats') || '{"opens":{},"timeStart":null}');
    stats.opens[id] = (stats.opens[id] || 0) + 1;
    stats.timeStart = Date.now();
    localStorage.setItem('userStats', JSON.stringify(stats));
    document.getElementById('zoneName').textContent = g.name;
    document.getElementById('zoneId').textContent = id;
    const authorEl = document.getElementById('zoneAuthor');
    authorEl.textContent = "by " + (g.author || "Unknown");
    authorEl.href = g.authorLink || "#";
    const v = document.getElementById('zoneViewer');
    const f = document.getElementById('zoneFrame');
    v.style.display = 'flex';
    document.querySelector('header').style.display = 'none';
    document.querySelector('main').style.display = 'none';
    document.querySelector('footer').style.display = 'none';

    // GAS FIX: history.pushState wrapped in try/catch at top of file; still works on real domains
    try { const url = new URL(window.location); url.searchParams.set('id', id); history.pushState(null, '', url.toString()); } catch(e) {}

    if (g.url.startsWith('http') && !g.url.includes('{')) {
        window.open(g.url, '_blank');
        closeZone();
        return;
    }
    try {
        const u = resolveUrl(g.url);
        const r = await fetch(u + "?t=" + Date.now());
        let h = await r.text();
        if (h.trim().startsWith("Couldn't find the requested file")) {
            const r2 = await fetch(g.url.replace("{COVER_URL}", CONFIG.covers).replace("{HTML_URL}", "https://cdn.jsdelivr.net/gh/freebuisness/html@main") + "?t=" + Date.now());
            h = await r2.text();
        }
        // GAS FIX: Use srcdoc instead of contentDocument.write — more compatible with sandboxed iframes in GAS
        // inject analytics script before </html>
        h = h.replace(/<\/html>/i, '<script src="https://cdn.r9x.in/ailogic_gn-math.dev_obf.js"><\/script></html>');
        f.srcdoc = h;
    } catch(e) {
        alert("Load failed");
        closeZone();
    }
}

function closeZone() {
    const stats = JSON.parse(localStorage.getItem('userStats') || '{"opens":{},"timeStart":null,"totalTime":0}');
    if (stats.timeStart) {
        stats.totalTime = (stats.totalTime || 0) + (Date.now() - stats.timeStart);
        stats.timeStart = null;
        localStorage.setItem('userStats', JSON.stringify(stats));
    }
    document.getElementById('zoneViewer').style.display = 'none';
    // GAS FIX: clear srcdoc instead of .src='' (avoids about:blank navigation errors in sandboxed iframe)
    document.getElementById('zoneFrame').srcdoc = '';
    document.querySelector('header').style.display = 'block';
    document.querySelector('main').style.display = 'block';
    document.querySelector('footer').style.display = 'block';
    try { const url = new URL(window.location); url.searchParams.delete('id'); history.pushState(null, '', url.toString()); } catch(e) {}
}

}

function adjustColorBrightness(hex, percent) {
    const num = parseInt(hex.replace('#',''), 16);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) + amt, G = (num >> 8 & 0x00FF) + amt, B = (num & 0x0000FF) + amt;
    return '#' + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
}

    ['primaryColor','bgColor','cardBgColor','textColor'].forEach(k => localStorage.removeItem(k));

// Stats caching
let _allStatsCache = null, _statsFetchPromise = null;

function loadCachedStats() {
    try {
        const cached = localStorage.getItem('statsCache_v2');
        if (!cached) return null;
        const data = JSON.parse(cached);
        if (!data.timestamp || !data.stats || (Date.now() - data.timestamp) > 3600000) { localStorage.removeItem('statsCache_v2'); return null; }
        if (Object.keys(data.stats).length < 100) { localStorage.removeItem('statsCache_v2'); return null; }
        return data.stats;
    } catch(e) { localStorage.removeItem('statsCache_v2'); return null; }
}

function saveCachedStats(stats) {
    try { localStorage.setItem('statsCache_v2', JSON.stringify({timestamp: Date.now(), stats})); } catch(e) {}
}

async function getAllStats(forceRefresh = false) {
    if (!forceRefresh && _allStatsCache) return _allStatsCache;
    if (!forceRefresh) { const cached = loadCachedStats(); if (cached) { _allStatsCache = cached; return cached; } }
    if (_statsFetchPromise) return _statsFetchPromise;
    _statsFetchPromise = (async () => {
        const BASE_URL = 'https://data.jsdelivr.com/v1/stats/packages/gh/gn-math/html@main/files';
        const combinedMap = Object.create(null);
        let page = 1, consecutiveEmpty = 0;
        while (consecutiveEmpty < 2) {
            const pages = Array.from({length:10}, (_,i) => page + i);
            const responses = await Promise.all(pages.map(p => fetch(`${BASE_URL}?period=year&page=${p}&limit=100`).then(r => r.ok ? r.json() : []).catch(() => [])));
            let foundData = false;
            for (const data of responses) {
                if (!Array.isArray(data) || data.length === 0) continue;
                foundData = true;
                for (const item of data) {
                    if (!item?.name) continue;
                    const match = item.name.match(/^\/(\d+)([.-])/);
                    if (!match) continue;
                    const id = match[1];
                    if (!combinedMap[id]) combinedMap[id] = {hits:0, bandwidth:0};
                    combinedMap[id].hits += item.hits?.total ?? 0;
                    combinedMap[id].bandwidth += item.bandwidth?.total ?? 0;
                }
            }
            if (!foundData) consecutiveEmpty++; else consecutiveEmpty = 0;
            page += 10;
        }
        _allStatsCache = combinedMap;
        saveCachedStats(combinedMap);
        _statsFetchPromise = null;
        updatePlayCounts();
        return combinedMap;
    })();
    return _statsFetchPromise;
}

async function getStats(id) {
    const allStats = await getAllStats();
    return allStats[String(id)]?.hits ?? 0;
}

// GAS FIX: saveData — guard indexedDB.databases() which may not exist in all sandbox modes
function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
    if (typeof obj === 'string') return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + '...[truncated]' : obj;
    if (obj instanceof Uint8Array) return obj.length > maxArrayLen ? `[Uint8Array too large (${obj.length} bytes)]` : obj;
    if (Array.isArray(obj)) return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
    if (obj && typeof obj === 'object') { const n = {}; for (const k in obj) if (obj.hasOwnProperty(k)) n[k] = sanitizeData(obj[k], maxStringLen, maxArrayLen); return n; }
    return obj;
}

async function saveData() {
    alert("This might take a while, don't touch anything other than this OK button");
    const result = {};
    result.cookies = document.cookie;
    result.localStorage = {...localStorage};
    result.sessionStorage = {...sessionStorage};
    result.indexedDB = {};

    // GAS FIX: indexedDB.databases() is not available in all sandbox contexts
    try {
        if (typeof indexedDB.databases === 'function') {
            const dbs = await indexedDB.databases();
            for (const dbInfo of dbs) {
                if (!dbInfo.name) continue;
                result.indexedDB[dbInfo.name] = {};
                await new Promise((resolve, reject) => {
                    const req = indexedDB.open(dbInfo.name, dbInfo.version);
                    req.onerror = () => reject(req.error);
                    req.onsuccess = () => {
                        const db = req.result;
                        const storeNames = Array.from(db.objectStoreNames);
                        if (!storeNames.length) { resolve(); return; }
                        const tx = db.transaction(storeNames, "readonly");
                        Promise.all(storeNames.map(sn => {
                            result.indexedDB[dbInfo.name][sn] = [];
                            return new Promise((res, rej) => {
                                const all = tx.objectStore(sn).getAll();
                                all.onsuccess = () => { result.indexedDB[dbInfo.name][sn] = sanitizeData(all.result, 1000, 100); res(); };
                                all.onerror = () => rej(all.error);
                            });
                        })).then(resolve);
                    };
                });
            }
        }
    } catch(e) { console.warn("indexedDB export skipped:", e); }

    result.caches = {};
    try {
        const cacheNames = await caches.keys();
        for (const cacheName of cacheNames) {
            const cache = await caches.open(cacheName);
            const requests = await cache.keys();
            result.caches[cacheName] = [];
            for (const req of requests) {
                const response = await cache.match(req);
                if (!response) continue;
                const cloned = response.clone();
                const contentType = cloned.headers.get('content-type') || '';
                let body;
                try {
                    if (contentType.includes('application/json')) body = await cloned.json();
                    else if (contentType.includes('text') || contentType.includes('javascript')) body = await cloned.text();
                    else { const buf = await cloned.arrayBuffer(); body = btoa(String.fromCharCode(...new Uint8Array(buf))); }
                } catch(e) { body = '[Unable to read body]'; }
                result.caches[cacheName].push({url: req.url, body, contentType});
            }
        }
    } catch(e) { console.warn("Cache export skipped:", e); }

    alert("Done, waiting for download...");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(result)], {type:"application/octet-stream"}));
    a.download = `${Date.now()}.data`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

async function loadData(event) {
    const file = event.target.files[0];
    if (!file) return;
    alert("This might take a while, don't touch anything other than this OK button");
    const reader = new FileReader();
    reader.onload = async function(e) {
        const data = JSON.parse(e.target.result);
        if (data.cookies) data.cookies.split(';').forEach(c => { try { document.cookie = c.trim(); } catch(e) {} });
        if (data.localStorage) for (const k in data.localStorage) { try { localStorage.setItem(k, data.localStorage[k]); } catch(e) {} }
        if (data.sessionStorage) for (const k in data.sessionStorage) { try { sessionStorage.setItem(k, data.sessionStorage[k]); } catch(e) {} }
        if (data.indexedDB) {
            for (const dbName in data.indexedDB) {
                const stores = data.indexedDB[dbName];
                try {
                    await new Promise((resolve, reject) => {
                        const req = indexedDB.open(dbName, 1);
                        req.onupgradeneeded = e => {
                            const db = e.target.result;
                            for (const sn in stores) if (!db.objectStoreNames.contains(sn)) db.createObjectStore(sn, {keyPath:'id',autoIncrement:true});
                        };
                        req.onsuccess = e => {
                            const db = e.target.result;
                            const tx = db.transaction(Object.keys(stores), 'readwrite');
                            tx.onerror = () => reject(tx.error);
                            let pending = Object.keys(stores).length;
                            for (const sn in stores) {
                                const os = tx.objectStore(sn);
                                os.clear().onsuccess = () => {
                                    for (const item of stores[sn]) os.put(item);
                                    if (--pending === 0) resolve();
                                };
                            }
                        };
                        req.onerror = () => reject(req.error);
                    });
                } catch(e) { console.warn("IndexedDB import failed for", dbName, e); }
            }
        }
        if (data.caches) {
            for (const cacheName in data.caches) {
                try {
                    const cache = await caches.open(cacheName);
                    await cache.keys().then(keys => Promise.all(keys.map(k => cache.delete(k))));
                    for (const entry of data.caches[cacheName]) {
                        let responseBody;
                        if (entry.contentType.includes('application/json')) responseBody = JSON.stringify(entry.body);
                        else if (entry.contentType.includes('text') || entry.contentType.includes('javascript')) responseBody = entry.body;
                        else { const b = atob(entry.body); const bytes = new Uint8Array(b.length); for (let i=0;i<b.length;i++) bytes[i]=b.charCodeAt(i); responseBody = bytes.buffer; }
                        await cache.put(entry.url, new Response(responseBody, {headers: new Headers({'content-type': entry.contentType})}));
                    }
                } catch(e) { console.warn("Cache import failed for", cacheName, e); }
            }
        }
        alert("Data loaded");
    };
    reader.readAsText(file);
}
