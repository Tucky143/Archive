// ── Audio pool (48 cap) ──
(()=>{
  const SZ=48,pool=[];
  for(let i=0;i<SZ;i++){const e=document.createElement('audio');e.preload='none';pool.push(e);}
  const get=()=>{for(const e of pool)if(e.paused&&e.readyState===0)return e;const e=pool[0];e.pause();e.src='';e.load();return e;};
  const NA=window.Audio;
  window.Audio=function(src){const e=get();if(src)e.src=src;return e;};
  Object.assign(window.Audio,NA);
  const nCE=document.createElement.bind(document);
  document.createElement=(t,...a)=>t.toLowerCase()==='audio'?get():nCE(t,...a);
})();

// ── XHR throttle (3 concurrent) ──
(()=>{
  const _X=window.XMLHttpRequest,Q=[],CON=3,DELAY=100;let act=0;
  const drain=()=>{if(act>=CON||!Q.length)return;act++;Q.shift()();};
  window.XMLHttpRequest=function(){
    const xhr=new _X(),_o=xhr.open.bind(xhr),_s=xhr.send.bind(xhr);
    let stream=false,oa;
    xhr.open=(...a)=>{stream=/sharedassets|resources\.resource/.test(a[1]||'');oa=a;if(!stream)_o(...a);};
    xhr.send=b=>{
      if(!stream){_s(b);return;}
      Q.push(()=>{
        _o(...oa);
        const done=()=>{act--;setTimeout(drain,DELAY);};
        const ol=xhr.onload,oe=xhr.onerror;
        xhr.onload=e=>{done();ol&&ol.call(xhr,e);};
        xhr.onerror=e=>{done();oe&&oe.call(xhr,e);};
        _s(b);
      });drain();
    };
    return xhr;
  };
  Object.assign(window.XMLHttpRequest,_X);
})();

// ── Auto-optimize ──
async function autoOptimize(){
  log('Benchmarking…','info');
  let s=(Math.min(navigator.hardwareConcurrency||2,16)*3)+(Math.min(navigator.deviceMemory||1,8)*5);
  const cvt=document.createElement('canvas');
  const gl=cvt.getContext('webgl');
  if(gl){const ext=gl.getExtension('WEBGL_debug_renderer_info');
    if(ext){const r=(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'').toLowerCase();
      if(/m[34]\s*(pro|max|ultra)|rtx\s*[4-9]/.test(r))s+=60;
      else if(/m[12]\s*(pro|max)|rtx\s*[23]/.test(r))s+=40;
      else if(/rtx\s*1|gtx\s*16|m1(?!\s)/.test(r))s+=25;
      else if(/gtx\s*[89]00|gtx\s*10/.test(r))s+=15;
      else if(/celeron|n[34][0-9]{3}/.test(r))s+=2;
      else if(/intel\s*(uhd|hd)/.test(r))s+=4;
      else s+=10;
    }
  }
  const t0=performance.now();let x=0;for(let i=0;i<4e6;i++)x=Math.sqrt(i*1.0001+x);
  const el=performance.now()-t0;s+=el<30?20:el<60?12:el<120?5:1;
  if(/Android|iPhone|iPad/.test(navigator.userAgent))s=Math.floor(s*.5);
  if(/CrOS/.test(navigator.userAgent))s=Math.min(s,22);
  const n=s>=55?'high':s>=35?'medium':s>=20?'low':s>=12?'cbsafe':s>=6?'superlow':'potato';
  log(`Score ${s} → ${n}`,'ok');applyPreset(n);
}

// ── IDB cache ──
const CDB='hk_cache_v4',CST='files';
let _cdb=null;
const openCDB=()=>{
  if(_cdb)return Promise.resolve(_cdb);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(CDB,1);
    r.onerror=()=>rej(r.error);
    r.onsuccess=()=>{_cdb=r.result;res(_cdb);};
    r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(CST))db.createObjectStore(CST,{keyPath:'path'});};
  });
};
const getCached=async p=>{const db=await openCDB();return new Promise((res,rej)=>{const r=db.transaction(CST,'readonly').objectStore(CST).get(p);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});};
const putCached=async(p,buf)=>{const db=await openCDB();return new Promise((res,rej)=>{const tx=db.transaction(CST,'readwrite');tx.objectStore(CST).put({path:p,buf,ts:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});};
async function clearCache(){
  const db=await openCDB();
  await new Promise((res,rej)=>{const tx=db.transaction(CST,'readwrite');tx.objectStore(CST).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
  log('Cache cleared','ok');
}

const CMAP={Prologue:'StreamingAssets/Prologue.mp4',Intro:'StreamingAssets/Intro.mp4',FinalA:'StreamingAssets/FinalA.mp4',FinalB:'StreamingAssets/FinalB.mp4',FinalC:'StreamingAssets/FinalC.mp4',FinalD:'StreamingAssets/FinalD.mp4',FinalE:'StreamingAssets/FinalE.mp4',Blacksmith:'StreamingAssets/Blacksmith.mp4',CharmSlugKiss:'StreamingAssets/CharmSlugKiss.mp4',Fountain:'StreamingAssets/Fountain.mp4',MaskShatter:'StreamingAssets/MaskShatter.mp4',MrMushroom:'StreamingAssets/MrMushroom.mp4',Nailsmith:'StreamingAssets/Nailsmith.mp4',NailsmithPaint:'StreamingAssets/NailsmithPaint.mp4',StagTunnelRun:'StreamingAssets/StagTunnelRun.mp4',Telescope:'StreamingAssets/Telescope.mp4'};
const GAME_FILES=[...Array.from({length:45},(_,i)=>`Build/hktruffled.data.part${i+1}`),'Build/hktruffled.wasm.part1','Build/hktruffled.wasm.part2','Build/hktruffled.framework.js','Build/hktruffled.loader.js',...Object.values(CMAP)];

async function autoCacheFiles(){
  const total=GAME_FILES.length;
  const db=await openCDB();
  const ex=await new Promise(r=>{const q=db.transaction(CST,'readonly').objectStore(CST).count();q.onsuccess=()=>r(q.result);});
  if(ex>=total){log('Fully cached','ok');return;}
  let done=0,failed=0;
  const q=[...GAME_FILES];
  await Promise.all(Array.from({length:4},async()=>{
    while(q.length){
      const path=q.shift();
      try{
        if(await getCached(path)){done++;}
        else{
          const resp=await fetch(path);
          if(resp.ok){
            const chunks=[];const reader=resp.body.getReader();
            while(true){const{done:d,value}=await reader.read();if(d)break;chunks.push(value);}
            const sz=chunks.reduce((a,c)=>a+c.length,0);
            const buf=new Uint8Array(sz);let off=0;for(const c of chunks){buf.set(c,off);off+=c.length;}
            await putCached(path,buf.buffer);done++;
          }else{failed++;done++;}
        }
      }catch{failed++;done++;}
    }
  }));
  log(`Cache: ${done-failed}/${total}${failed?' ('+failed+' failed)':''}`,failed?'warn':'ok');
}

// ── Fetch pipeline ──
const TOTAL_MB=912.81;let _lb=0,_te=0;
const setP=p=>{const v=Math.min(100,Math.round(p));document.getElementById('lf').style.width=v+'%';document.getElementById('lp').textContent=v+'%';};
const setSub=m=>{document.getElementById('ls2').textContent=m;};

async function fetchWithCache(path){
  const cached=await getCached(path);
  if(cached?.buf){_lb+=cached.buf.byteLength;setP(_lb/(_te||1)*100);return cached.buf;}
  const resp=await fetch(path);
  if(!resp.ok)throw new Error(`HTTP ${resp.status}: ${path}`);
  const reader=resp.body.getReader();const chunks=[];
  while(true){const{done,value}=await reader.read();if(done)break;_lb+=value.length;chunks.push(value);setP(_lb/(_te||TOTAL_MB*1048576)*100);setSub(`${(_lb/1048576).toFixed(1)} / ${TOTAL_MB} MB`);}
  const buf=new Uint8Array(chunks.reduce((a,c)=>a+c.length,0));
  let off=0;for(const c of chunks){buf.set(c,off);off+=c.length;}
  putCached(path,buf.buffer).catch(()=>{});
  return buf.buffer;
}

async function fetchPartsParallel(base,from,to){
  const paths=Array.from({length:to-from+1},(_,i)=>`${base}.part${from+i}`);
  const q=[...paths.map((p,i)=>({p,i}))];const bufs=new Array(paths.length);
  await Promise.all(Array.from({length:4},async()=>{while(q.length){const{p,i}=q.shift();bufs[i]=await fetchWithCache(p);}}));
  const total=bufs.reduce((a,b)=>a+b.byteLength,0);
  const out=new Uint8Array(total);let off=0;for(const b of bufs){out.set(new Uint8Array(b),off);off+=b.byteLength;}
  return out.buffer;
}

const fGP={id:'Xbox 360 Controller (XInput STANDARD GAMEPAD)',index:0,connected:true,mapping:'standard',get timestamp(){return performance.now();},get axes(){return[..._gps.axes];},get buttons(){return _gps.buttons.map(b=>({pressed:b.pressed,touched:b.touched,value:b.value}));}};

(function syncGP(){

// ── Cutscene ──
let csState='idle';
const hkv=document.createElement('video');
hkv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:99998;display:none';
hkv.playsinline=true;hkv.muted=false;document.body.appendChild(hkv);
hkv.addEventListener('ended',()=>{hkv.style.display='none';hkv.removeAttribute('src');hkv.load();csState='done';setTimeout(doSkipAll,80);});
hkv.addEventListener('error',()=>{hkv.style.display='none';csState='idle';doSkipAll();});

function csPlay(name){
  if(!CMAP[name]||csState==='playing')return;
  csState='playing';
  fetch(CMAP[name],{method:'HEAD'}).then(r=>{
    if(!r.ok){csState='idle';doSkipAll();return;}
    hkv.src=CMAP[name];hkv.style.display='block';hkv.currentTime=0;
    hkv.play().catch(()=>{csState='done';doSkipAll();});
  }).catch(()=>{csState='idle';doSkipAll();});
}

function doSkipAll(){
  [{key:'Escape',keyCode:27},{key:'Return',keyCode:13},{key:' ',keyCode:32},{key:'z',keyCode:90}].forEach(k=>{
    const o={...k,which:k.keyCode,bubbles:true,cancelable:true};
    cv.dispatchEvent(new KeyboardEvent('keydown',o));cv.dispatchEvent(new KeyboardEvent('keyup',o));
  });
  const r=cv.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  ['pointerdown','pointerup','click'].forEach(t=>cv.dispatchEvent(new MouseEvent(t,{clientX:cx,clientY:cy,bubbles:true})));
  const saved=[..._gps.buttons];
  _gps.buttons=Array.from({length:17},()=>({pressed:true,touched:true,value:1}));
  setTimeout(()=>{_gps.buttons=saved;},250);fireGP();
  setTimeout(()=>{csState='idle';},500);
}

// ── Log ──
const logEl=()=>document.getElementById('log');
function log(msg,cls='log'){
  const el=logEl();if(!el)return;
  const d=document.createElement('div');
  const t=new Date();
  d.style.color=cls==='ok'?'#4caf50':cls==='err'?'#ef5350':cls==='warn'?'#ffa726':cls==='info'?'#5c9cf5':cls==='hi'?'#c8a96e':'#444';
  d.style.cssText+='font-size:8px;padding:1px 2px;border-bottom:1px solid #0a0a0a;white-space:pre-wrap;word-break:break-all';
  d.textContent=`${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')} ${msg}`;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
  if(el.childNodes.length>200)el.removeChild(el.firstChild);
}

// ── Console intercept ──
(()=>{
  const lvls={log:'log',warn:'warn',error:'err',info:'info',debug:'log'};
  for(const[lvl,cls]of Object.entries(lvls)){
    const orig=console[lvl].bind(console);
    console[lvl]=(...args)=>{
      orig(...args);
      const msg=args.map(a=>{try{return typeof a==='string'?a:JSON.stringify(a);}catch{return String(a);}}).join(' ');
      if(lvl==='log'){
        const m=msg.match(/(?:Started|Playing)\s+cinematic\s+'?(\w+)'?/i);
        if(m&&csState==='idle')csPlay(m[1]);
        if(/Stopped\s+cinematic/i.test(msg)){hkv.style.display='none';hkv.pause();csState='idle';}
      }
      log(msg,cls);
    };
  }
})();

// ── Save / Restore using /idbfs ──
let _saveData=null;

async function doDownloadSave(){
  log('Scanning save…','hi');
  const dbs=await indexedDB.databases();
  if(!dbs.some(d=>d.name==='/idbfs')){log('No save found — play first','err');return;}
  const req=indexedDB.open('/idbfs');
  req.onerror=()=>log('Could not open save DB','err');
  req.onsuccess=e=>{
    const db=e.target.result;
    const tx=db.transaction('FILE_DATA','readonly'),st=tx.objectStore('FILE_DATA');
    const vr=st.getAll(),kr=st.getAllKeys();
    vr.onsuccess=()=>kr.onsuccess=()=>{
      const data=kr.result.map((key,i)=>{
        const v=vr.result[i];let c=v.contents;
        if(c instanceof Int8Array){const o={};for(let j=0;j<c.length;j++)o[j]=c[j];c=o;}
        return{key,value:{timestamp:v.timestamp,mode:v.mode,contents:c}};
      });
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
      a.download='hk-save.json';a.click();
      log('Save downloaded','ok');
    };
  };
}

function loadSF(file){
  const r=new FileReader();
  r.onload=e=>{try{_saveData=JSON.parse(e.target.result);log('Save loaded: '+file.name+' ('+(_saveData.length||'?')+' entries)','ok');}catch(err){log('Bad file: '+err.message,'err');}};
  r.readAsText(file);
}

async function doInjectSave(){
  if(!_saveData){log('No save loaded','err');return;}
  log('Injecting…','hi');
  const req=indexedDB.open('/idbfs');
  req.onerror=()=>log('Could not open save DB','err');
  req.onsuccess=e=>{
    const db=e.target.result;
    db.transaction('FILE_DATA','readonly').objectStore('FILE_DATA').getAllKeys().onsuccess=ev=>{
      let hash=null;
      for(const k of ev.target.result){const p=k.split('/');if(p.length>=3){hash=p[2];break;}}
      const tx=db.transaction('FILE_DATA','readwrite'),st=tx.objectStore('FILE_DATA');
      st.clear();let w=0;
      _saveData.forEach(entry=>{
        let key=entry.key;
        if(hash){const p=key.split('/');if(p.length>=3){p[2]=hash;key=p.join('/');}}
        let c=entry.value.contents;
        if(c&&typeof c==='object'&&!(c instanceof Int8Array)){
          const idx=Object.keys(c).map(Number).sort((a,b)=>a-b);
          const arr=new Int8Array(idx.length);idx.forEach(i=>arr[i]=c[i]);c=arr;
        }
        st.put({timestamp:new Date(entry.value.timestamp),mode:entry.value.mode,contents:c},key);w++;
      });
      tx.oncomplete=()=>{log(`Injected ${w} entries — reloading…`,'ok');db.close();setTimeout(()=>location.reload(),1500);};
      tx.onerror=err=>log('Write error: '+err,'err');
    };
  };
}

// ── Memory pressure ──
let _mpdropped=false;
setInterval(()=>{
  const m=performance.memory;if(!m)return;
  const used=m.usedJSHeapSize,limit=m.jsHeapSizeLimit;
  if(C.memPressure&&!_mpdropped&&used/limit>.85){
    _mpdropped=true;
    C.resolution=Math.max(0,C.resolution-1);saveC();applyRes();
    log('⚠ Heap >85% — res dropped','warn');
  }
  if(used/limit<.7)_mpdropped=false;
},3000);

// AudioContext unlock
(()=>{
  const resume=()=>{
    if(window._actxUnlocked)return;
    const ctx=window.AudioContext||window.webkitAudioContext;
    if(ctx){const _AC=ctx;window[ctx===window.AudioContext?'AudioContext':'webkitAudioContext']=function(...a){const c=new _AC(...a);if(c.state==='suspended')c.resume().catch(()=>{});return c;};}
    window._actxUnlocked=true;
  };
  ['pointerdown','keydown','touchstart'].forEach(e=>window.addEventListener(e,resume,{once:true,capture:true}));
})();

// FS sync guard
window._patchFSSync=()=>{
  if(!window.FS||window.FS._patched)return;
  window.FS._patched=true;let _syncing=false;
  const orig=window.FS.syncfs;
  window.FS.syncfs=function(populate,cb){
    if(_syncing){if(cb)cb(null);return;}
    _syncing=true;orig.call(window.FS,populate,(err)=>{_syncing=false;if(cb)cb(err);});
  };
};

// ── Unity config ──
const _blobs=new Set();
function buildUnityConfig(dataUrl,wasmBuf,fwUrl){
  return{
    dataUrl,frameworkUrl:fwUrl,
    instantiateWasm(imports,onSuccess){WebAssembly.instantiate(wasmBuf,imports).then(r=>onSuccess(r.instance,r.module)).catch(e=>log('WASM err: '+e,'err'));return{};},
    streamingAssetsUrl:'StreamingAssets',companyName:'Team Cherry',productName:'Hollow Knight',productVersion:'1.0',
    devicePixelRatio:C.dpiScale,matchWebGLToCanvasSize:false,memory:C.memory*1024*1024,
    webglContextAttributes:{antialias:C.antialias,alpha:false,depth:C.depth,stencil:C.stencil,premultipliedAlpha:false,preserveDrawingBuffer:C.preserveDrawingBuffer,desynchronized:C.desynchronized,powerPreference:C.powerPreference,failIfMajorPerformanceCaveat:false}
  };
}

async function launchUnity(setProgress,setSubtitle,onReady){
  setSubtitle('Loading files…');
  const[dataBuf,wasmBuf,fwBuf,ldrBuf]=await Promise.all([
    fetchPartsParallel('Build/hktruffled.data',1,45),
    fetchPartsParallel('Build/hktruffled.wasm',1,2),
    fetchWithCache('Build/hktruffled.framework.js'),
    fetchWithCache('Build/hktruffled.loader.js'),
  ]);
  const dataUrl=URL.createObjectURL(new Blob([dataBuf]));_blobs.add(dataUrl);
  const fwUrl=URL.createObjectURL(new Blob([fwBuf],{type:'application/javascript'}));_blobs.add(fwUrl);
  const ldrUrl=URL.createObjectURL(new Blob([ldrBuf],{type:'application/javascript'}));_blobs.add(ldrUrl);
  setSubtitle('Starting engine…');setProgress(99);
  document.querySelectorAll('script[data-hkl]').forEach(s=>s.remove());
  const sc=document.createElement('script');sc.src=ldrUrl;sc.dataset.hkl='1';
  await new Promise((res,rej)=>{sc.onload=res;sc.onerror=()=>rej(new Error('Loader failed'));document.body.appendChild(sc);});
  setProgress(100);
  const inst=await createUnityInstance(cv,buildUnityConfig(dataUrl,wasmBuf,fwUrl));
  window.unityInstance=inst;window._patchFSSync?.();
  onReady();
  setTimeout(()=>{_blobs.forEach(u=>URL.revokeObjectURL(u));_blobs.clear();},8*60*1000);
}

function row(label,id,type,extra=''){return `<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0;border-bottom:1px solid #0d0d0d"><span style="color:#555;font-size:9px">${label}</span><${type} id="${id}" ${extra} style="background:#0a0a0a;border:1px solid #1a1a1a;color:#888;font:9px monospace;padding:2px 4px"></${type}></div>`;
}

  `,
  gpu:()=>`
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0"><span style="color:#555;font-size:9px">Render Scale</span><span style="display:flex;align-items:center;gap:4px"><input type="range" min="0" max="8" step="1" value="${C.resolution}" oninput="C.resolution=+this.value;saveC();applyRes();this.nextElementSibling.textContent=RESL[C.resolution]" style="width:80px"><span style="color:#c8a96e;font-size:9px;width:32px">${RESL[C.resolution]}</span></span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0"><span style="color:#555;font-size:9px">DPI Scale</span><span style="display:flex;align-items:center;gap:4px"><input type="range" min="1" max="30" step="1" value="${Math.round(C.dpiScale*10)}" oninput="C.dpiScale=+this.value/10;saveC();applyRes();this.nextElementSibling.textContent=C.dpiScale.toFixed(1)+'×'" style="width:80px"><span style="color:#c8a96e;font-size:9px;width:32px">${C.dpiScale.toFixed(1)}×</span></span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0"><span style="color:#555;font-size:9px">Memory (MB)</span><span style="display:flex;align-items:center;gap:4px"><input type="range" min="64" max="1024" step="64" value="${C.memory}" oninput="C.memory=+this.value;saveC();this.nextElementSibling.textContent=this.value" style="width:80px"><span style="color:#c8a96e;font-size:9px;width:32px">${C.memory}</span></span></div>
      ${[['antialias','Antialias'],['shadows','Shadows'],['bloom','Bloom'],['vignette','Vignette'],['disablePostFX','No Post FX'],['memPressure','Mem Pressure']].map(([k,l])=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0"><span style="color:#555;font-size:9px">${l}</span><input type="checkbox" ${C[k]?'checked':''} onchange="S('${k}',this.checked)"></div>`).join('')}
    </div>
  `,
  sav:()=>`
    <div style="display:flex;flex-direction:column;gap:4px">
      ${btn('Download Save','doDownloadSave()')}
      <div id="dz2" onclick="document.getElementById('fi2').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();loadSF(event.dataTransfer.files[0])" style="border:1px dashed #222;padding:8px;text-align:center;cursor:pointer;color:#333;font-size:8px">Drop / click to load save file</div>

      <div style="display:flex;gap:3px"><input id="surl" type="url" placeholder="https://…/hk-save.json" style="flex:1;background:#0a0a0a;border:1px solid #1a1a1a;color:#666;padding:3px 5px;font:8px monospace">${btn('Fetch','(async()=>{const u=document.getElementById("surl").value.trim();if(!u)return;try{const r=await fetch(u);if(!r.ok)throw Error("HTTP "+r.status);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([await r.text()],{type:"application/json"}));a.download="hk-save.json";a.click();}catch(e){log("Fetch: "+e.message,"err");}})();')}</div>
      ${btn('Clear Cache','clearCache()')}

  log:()=>`
    <div id="log" style="background:#070707;border:1px solid #111;height:200px;overflow-y:auto;padding:4px;margin-bottom:4px"></div>
    <div style="display:flex;gap:3px">
      <input id="ci" placeholder="JS eval / Obj/Method/Param…" onkeydown="if(event.key==='Enter')conSend()" style="flex:1;background:#070707;border:1px solid #1a1a1a;color:#888;padding:3px 5px;font:8px monospace">

function buildUI(){
  const tabs=document.getElementById('tabs');
  const pg=document.getElementById('pg');
  tabs.innerHTML=TABS.map(([id,label])=>`<button onclick="switchTab('${id}')" style="padding:3px 8px;background:${_curTab===id?'#1a1a1a':'#0d0d0d'};color:${_curTab===id?'#c8a96e':'#555'};border:1px solid ${_curTab===id?'#c8a96e33':'#1a1a1a'};cursor:pointer;font:9px monospace">${label}</button>`).join('');
  pg.innerHTML=`<div style="padding:4px 0">${(PAGE[_curTab]||PAGE.pre)()}</div>`;
}

function switchTab(id){_curTab=id;buildUI();}

function conSend(){
  const inp=document.getElementById('ci');
  const txt=inp.value.trim();if(!txt)return;
  log('> '+txt,'hi');inp.value='';
  const sm=txt.match(/^(\S+)\s*\/\s*(\S+)(?:\s*\/\s*(.*))?$/);
  if(sm&&window.unityInstance){try{window.unityInstance.SendMessage(sm[1],sm[2],sm[3]||'');log('SendMessage OK','ok');}catch(e){log('SendMessage err: '+e.message,'err');}return;}
  try{const res=eval(txt);if(res!==undefined)log(String(res),'ok');}catch(e){log(e.message,'err');}
}

// ── Boot ──
(async()=>{
  loadC();buildUI();
  cv.style.cssText='width:100vw;height:100vh;image-rendering:pixelated';
  const idx=Math.min(C.resolution,RES.length-1);
  cv.width=Math.round(window.innerWidth*RES[idx]*(C.dpiScale||1));
  cv.height=Math.round(window.innerHeight*RES[idx]*(C.dpiScale||1));
  await openCDB();
  _te=TOTAL_MB*1048576;
  const lsEl=document.getElementById('ls');
  try{
    await launchUnity(
      p=>{const v=Math.min(100,Math.round(p));document.getElementById('lf').style.width=v+'%';document.getElementById('lp').textContent=v+'%';},

      ()=>{
        log('Unity ready','ok');
        log(`${C.preset||'custom'} | ${RESL[idx]} | ${C.memory}MB`,'hi');
        lsEl.style.transition='opacity .5s';lsEl.style.opacity='0';
        setTimeout(()=>lsEl.remove(),600);

    );
  }catch(e){
    log('Boot error: '+e.message,'err');
    document.getElementById('ls2').textContent='Error — see log';
  }
})();
